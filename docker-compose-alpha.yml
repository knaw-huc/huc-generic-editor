services:
  alpha-cmdicdn:
    image: ghcr.io/knaw-huc/huc-generic-editor:1.0-rc9-alpha-5
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alpha-cmdicdn.entrypoints=http"
      - "traefik.http.routers.alpha-cmdicdn.rule=Host(`alpha-cmdicdn.sd.di.huc.knaw.nl`)"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
